name: Preparation equivalence and contention
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Cancel superseded PR checks without canceling exact-main release evidence.
  group: preparation-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  native-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: isolated-preparation-only
          POSTGRES_DB: icash_preparation_test
        ports:
          - 55444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Install pinned native test driver outside project
        run: npm install --prefix "$RUNNER_TEMP/preparation-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Native generic/custom equivalence, hostile cases and lock races
        env:
          PREPARATION_NATIVE_TEST: '1'
          PREPARATION_PERFORMANCE_TEST: '1'
          PREPARATION_PG_MODULE: ${{ runner.temp }}/preparation-pg/node_modules/pg
        run: node --experimental-strip-types tests/operational-preparation-receipt-bindings.test.mjs
      - name: Retain complete native benchmark plans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preparation-native-plans-${{ github.sha }}
          path: |
            /tmp/icash-preparation-receipt-binding-plans.json
            /tmp/icash-preparation-warm-plans.json
          if-no-files-found: warn
          retention-days: 14
