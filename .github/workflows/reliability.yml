name: Reliability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A production deployment verifies its exact main commit. A newer push must
  # not cancel the checks that can restore that deployment during an outage.
  # Superseded PR checks can still be cancelled to avoid redundant work.
  group: reliability-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm audit --prod --audit-level=high
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  verify:
    # Playwright 1.56.1 provides browser dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      META_INSTANT_LEADS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:verified
      - run: pnpm run test:concurrency
      - name: Use Ubuntu primary package mirror
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path

          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list')]
          directory = Path('/etc/apt/sources.list.d')
          paths += list(directory.glob('*.list')) + list(directory.glob('*.sources'))
          for path in paths:
              if not path.is_file():
                  continue
              source = path.read_text()
              updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if updated != source:
                  path.write_text(updated)
          PY
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:browser
