name: Reliability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A production deployment verifies its exact main commit. A newer push must
  # not cancel the checks that can restore that deployment during an outage.
  # Superseded PR checks can still be cancelled to avoid redundant work.
  group: reliability-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  database-contention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: icash_reliability
        ports:
          - 55443:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify learning refresh under real concurrent transactions
        run: python3 scripts/test-learning-refresh-postgres.py
      - name: Verify durable deal supervision and concurrent source wakeups
        run: python3 scripts/test-deal-supervisor-postgres.py
      - name: Verify corrected evidence rejects concurrent stale training results
        run: python3 scripts/test-learning-evidence-cutover-postgres.py
      - name: Verify prospective text learning under concurrent queues and customer Pause
        run: python3 scripts/test-seller-sms-learning-v5-postgres.py
      - name: Verify direct cash questions under concurrent queues and Pause
        run: python3 scripts/test-seller-cash-questions-postgres.py
      - name: Verify sender recovery pacing under concurrent seller introductions
        run: python3 scripts/test-sender-delay-opener-postgres.py
      - name: Verify shared Contiguity sender limits under concurrent dispatch
        run: python3 scripts/test-contiguity-sender-volume-postgres.py
      - name: Verify new-number daytime pacing under concurrent dispatch
        run: python3 scripts/test-november-sender-pacing-postgres.py
      - name: Verify independent targeting query receipts under concurrent admission
        if: ${{ !cancelled() }}
        run: python3 scripts/test-targeting-query-binding-postgres.py
      - name: Verify one mobile introduction number per owner under concurrent admission
        if: ${{ !cancelled() }}
        run: python3 scripts/test-dealmachine-list-quality-postgres.py
      - name: Verify one-use owner preflights under real concurrent transactions
        run: python3 scripts/test-owner-preflight-postgres.py
      - name: Verify local quota refusal recovery under concurrent transactions
        run: python3 scripts/test-preflight-quota-postgres.py
      - name: Verify new-user research reserve under concurrent transactions
        run: python3 scripts/test-new-user-request-reserve-postgres.py
      - name: Verify paced research and maintenance reserve under concurrent transactions
        run: python3 scripts/test-research-request-pacing-postgres.py
      - name: Verify one-use owner demo research allowance under concurrent transactions
        run: python3 scripts/test-owner-demo-request-postgres.py
      - name: Verify delayed contact checks survive concurrent cleanup
        run: python3 scripts/test-preflight-waiting-postgres.py
      - name: Verify original list indexing, bounded polling and fair concurrent progress
        run: python3 scripts/test-owner-preflight-indexing-postgres.py
      - name: Verify due retry ranking skips unrelated receipt dependencies
        run: python3 scripts/test-preflight-receipt-ranking-postgres.py
      - name: Verify due contact list priority, competing issuers and late holds
        run: python3 scripts/test-owner-preflight-priority-postgres.py
      - name: Verify fair due-retry progress and bounded generic-plan history lookup
        run: python3 scripts/test-owner-retry-priority-postgres.py
      - name: Verify verified contact cohorts retain their original admission window
        run: python3 scripts/test-owner-preflight-ready-postgres.py
      - name: Verify indexed acquisition selection preserves active ticket guards
        run: python3 scripts/test-acquisition-active-ticket-index-postgres.py
      - name: Verify held discovery preserves concurrent independent progress
        run: python3 scripts/test-discovery-hold-postgres.py
      - name: Verify indexed property evidence preserves all original holds
        run: python3 scripts/test-acquisition-property-history-index-postgres.py
      - name: Verify global text history exclusion uses the thread index
        run: python3 scripts/test-text-message-thread-index-postgres.py
      - name: Verify bounded opener scans, concurrent cursors and late customer holds
        run: python3 scripts/test-seller-opener-bounded-postgres.py
      - name: Verify bounded direct seller dispatch and preserved invitation claims
        run: python3 scripts/test-seller-dispatch-bounded-postgres.py
      - name: Verify literal seller identity and concurrent one-use opener preparation
        run: python3 scripts/test-seller-opener-ampersand-postgres.py
      - name: Verify literal address copy and concurrent final source review
        run: python3 scripts/test-seller-opener-literal-address-postgres.py
      - name: Verify footer-free seller copy against concurrent queues and active tickets
        run: python3 scripts/test-seller-opener-footer-free-postgres.py
      - name: Verify ordinary calling hours avoid unrelated owner evidence locks
        run: python3 scripts/test-outreach-predicates-postgres.py
      - name: Verify workflow selection skips unrelated locked capacity and history
        run: python3 scripts/test-workflow-stall-postgres.py
      - name: Verify bounded configuration recovery and concurrent admission
        run: python3 scripts/test-voice-configuration-target-lookup-postgres.py
      - name: Verify configuration recovery capacity snapshot under contention
        run: python3 scripts/test-voice-configuration-target-lookup-postgres.py --capacity-snapshot
      - name: Verify eighty-percent voice capacity claim under contention
        run: python3 scripts/test-eighty-percent-voice-capacity-postgres.py
      - name: Verify urgent voice source filtering and concurrent fair issuance
        run: python3 scripts/test-urgent-voice-source-gate-postgres.py
      - name: Verify legacy voice history is excluded before native eligibility checks
        run: python3 scripts/test-legacy-voice-candidate-fence-postgres.py
      - name: Verify indexed global voice contact exclusion preserves unknown calls
        run: python3 scripts/test-voice-global-contact-index-postgres.py
      - name: Verify ordinary phone filtering preserves concurrent capacity and fairness
        run: python3 scripts/test-ordinary-voice-phone-fence-postgres.py
      - name: Verify empty batch previews preserve source and concurrent controls
        run: python3 scripts/test-owner-preview-empty-postgres.py
      - name: Verify reviewed preview rejection recovery under concurrent admission
        run: python3 scripts/test-owner-preview-rejection-recovery-postgres.py
      - name: Verify original text receipt recovery and callback races
        run: python3 scripts/test-text-delivery-recovery-postgres.py
      - name: Verify bounded receipt queue fairness and competing recovery workers
        run: python3 scripts/test-text-receipt-fairness-postgres.py
      - name: Verify original incoming identity recovery and late receipt races
        run: python3 scripts/test-recorded-reception-retry-postgres.py
      - name: Verify private ingress diagnostics under concurrent webhook failures
        run: python3 scripts/test-text-ingress-health-postgres.py
      - name: Verify prospective pre-dial abort and late provider admission
        run: python3 scripts/test-voice-predial-abort-postgres.py
      - name: Verify historical cleanup recovery and concurrent customer Pause
        run: python3 scripts/test-cleanup-ticket-recovery-postgres.py
      - name: Verify bounded saved export recovery without provider retries
        run: python3 scripts/test-owner-export-artifact-postgres.py
      - name: Verify unanswered call settlement and late child races
        run: python3 scripts/test-customer-phone-unanswered-postgres.py
      - name: Verify unanswered child settlement preserves priced parent and audio
        run: python3 scripts/test-customer-phone-child-unanswered-postgres.py
      - name: Verify seller recovery, receipts and Pause under concurrent transactions
        run: python3 scripts/test-seller-progress-postgres.py
      - name: Verify buyer assignment terms against competing claims and concurrent edits
        run: python3 scripts/test-buyer-assignment-snapshot-postgres.py
      - name: Verify automatic export recovery under concurrent transactions
        run: python3 scripts/test-automatic-export-postgres.py
      - name: Verify unknown export capacity isolation under concurrent transactions
        run: python3 scripts/test-unknown-export-postgres.py
      - name: Verify indexed owner evidence under concurrent reads
        run: python3 scripts/test-owner-evidence-postgres.py
      - name: Verify account recovery skips busy dispatch without deadlock
        run: python3 scripts/test-account-recovery-postgres.py
      - name: Verify account repair and customer Pause under concurrent transactions
        run: python3 scripts/test-account-work-postgres.py
      - name: Verify reviewed planning relief, fresh admission and late receipts under contention
        run: python3 scripts/test-reviewed-pending-work-postgres.py
      - name: Verify legacy search quarantine and customer Pause under concurrent transactions
        run: python3 scripts/test-legacy-search-postgres.py
      - name: Verify exact fresh-contact revalidation under concurrent controls
        run: python3 scripts/test-seller-contact-revalidation-postgres.py
      - name: Verify independent market continuation under concurrent controls
        run: python3 scripts/test-market-hold-continuation-postgres.py
      - name: Verify financial prefilters and free-only widening under concurrent controls
        run: python3 scripts/test-financial-prequalification-postgres.py
      - name: Verify one-use phone checks and immutable receipts under concurrent claims
        run: python3 scripts/test-seller-contact-refresh-postgres.py
      - name: Verify one busy historical receipt cannot block independent acquisition
        run: python3 scripts/test-acquisition-settlement-isolation-postgres.py
      - name: Verify bounded acquisition aging across shared export waits
        run: python3 scripts/test-export-capacity-wait-fairness-postgres.py
      - name: Verify phone inventory buffer under concurrent claim changes
        run: python3 scripts/test-phone-inventory-buffer-postgres.py
      - name: Verify settled billing entries cannot starve receipt recovery
        run: python3 scripts/test-outbound-billing-drain-postgres.py
      - name: Verify free custom voice preview under concurrent clicks
        run: python3 scripts/test-custom-voice-preview-postgres.py
      - name: Verify confirmed contract delivery under competing claims
        run: python3 scripts/test-confirmed-contract-delivery-postgres.py
      - name: Verify saved Ask AI actions under concurrent replies and retries
        run: python3 scripts/test-assistant-actions-postgres.py
  outreach-preparation-contention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: isolated-preparation-only
          POSTGRES_DB: icash_preparation_test
        ports:
          - 55444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Install fixed local database driver outside the project
        run: npm install --prefix "$RUNNER_TEMP/outreach-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Verify source-bound preparation and original locks
        env:
          PREPARATION_NATIVE_TEST: '1'
          PREPARATION_PG_MODULE: ${{ runner.temp }}/outreach-pg/node_modules/pg
        run: node --experimental-strip-types tests/operational-preparation-source-fence.test.mjs
  seller-quota-contention:
    # Separate disposable DB: never share schema resets with other native suites.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: icash_reliability
        ports:
          - 55443:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify eligible seller quota under native concurrent transactions
        run: python3 scripts/test-seller-atomic-quota-postgres.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm audit --prod --audit-level=high
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  verify:
    # Match the locked Playwright version. The official image includes its
    # browsers and system dependencies, avoiding live Ubuntu mirror downloads.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2
      options: --shm-size=1g
    timeout-minutes: 20
    env:
      META_INSTANT_LEADS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # all-tests runs every offline suite for this exact commit. Build/browser
      # verification stays independent without running that suite a second time.
      - run: pnpm build
      - run: pnpm run test:concurrency
      - run: pnpm run test:browser
